<!DOCTYPE html>
<html>
<head>
  <title>Simple JS App</title>
  <script src="https://unpkg.com/parse/dist/parse.min.js"></script>
</head>
<body>

<h3>Simple JS App</h3>

<input id="msg" onkeypress="if(event.key==='Enter')save()" placeholder="Message">
<button onclick="save()">Save</button>
<button onclick="clearAll()">Delete All</button>

<ul id="list"></ul>

<script>
Parse.initialize(
  "djkSHBgfXAnlutSN8QALWWcIXS3QfhwNdW69uzTt",
  "J6MyioChlfen0LSeH8xqRwVmmi0kFSBJ2Uojk8hn"
);
Parse.serverURL = "https://parseapi.back4app.com";

const input = document.getElementById("msg");
const list = document.getElementById("list");

async function save() {
  if (!input.value) return;
  await new Parse.Object("Message").save({ text: input.value +" " });
  input.value = "";
  load();
}

async function load() {
  
  const msgs = await new Parse.Query("Message")
    .descending("createdAt")
    .find();


  msgs.forEach(m => list.innerHTML +=m.get("text"));
    list.innerHTML ="";
    msgs.forEach(m => list.innerHTML +=m.get("text"));
}

async function clearAll() {
  if (!confirm("Delete all messages?")) return;
  const msgs = await new Parse.Query("Message").find();
  await Parse.Object.destroyAll(msgs);
  load();
}

load();

setInterval(load)
</script>

</body>
</html>
